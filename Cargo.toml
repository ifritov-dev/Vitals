[package]
name = "vitals"
version = "1.1.0"
edition = "2021"
description = "A macOS menu bar sensor monitor in the spirit of the GNOME Vitals extension"
license = "GPL-3.0-or-later"
rust-version = "1.75"
authors = ["ifritov-dev"]
repository = "https://github.com/ifritov-dev/vitals"
keywords = ["macos", "menu-bar", "sensors", "smc", "monitoring"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2"

[[bin]]
name = "vitals"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
