name: Build

# Manual only: nothing here runs on a push or a pull request. Start it from
# Actions → Build → Run workflow when a build and the self-test are wanted.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and self-test
    # arm64, like the release: the Objective-C interop assumes objc_msgSend's
    # arm64 calling convention.
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # The self-test needs no bundle and no network: it asserts the decoders,
      # the formatters, the battery maths and the release parser against known
      # bytes, so a broken build never reaches a release.
      - name: Self-test
        run: ./target/release/vitals --selftest
